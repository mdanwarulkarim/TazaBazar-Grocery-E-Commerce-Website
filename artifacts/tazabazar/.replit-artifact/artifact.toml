kind = "web"
previewPath = "/"
title = "TazaBazar"
version = "1.0.0"
id = "artifacts/tazabazar"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25427

[services.development]
run = "pnpm --filter @workspace/tazabazar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tazabazar", "run", "build" ]
publicDir = "artifacts/tazabazar/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25427"
BASE_PATH = "/"
